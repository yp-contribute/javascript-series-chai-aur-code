<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Project - Color Changer | Chai Aur Code | Yashwant Pandey</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="canvas">
        <h1>Color Scheme Switcher</h1>
        <input type="button" class="button" id="grey" value="Grey" />
        <input type="button" class="button" id="white" value="White" />
        <input type="button" class="button" id="yellow" value="Yellow" />
        <input type="button" class="button" id="blue" value="Blue" />
        <h2>
            Try clicking on one of the colors above
            <span>
                To change the background color of this page!
            </span>
        </h2>
    </div>

    <script src="./script.js"></script>
</body>
